<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筋トレマシン図鑑</title>
  <meta name="description" content="ジムの筋トレマシンの使い方を動画でチェックできる一覧ページ" />
  <meta name="theme-color" content="#111827" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="wrap">
      <h1>筋トレマシン図鑑</h1>
      <p class="sub">ジムのマシンの使い方を動画でチェック</p>
      <input id="search" class="search" type="search" placeholder="マシン名・部位で検索（例：胸、レッグ）" />
      <nav id="filters" class="filters" aria-label="部位で絞り込み"></nav>
    </div>
  </header>

  <main class="wrap">
    <p id="count" class="count"></p>
    <ul id="grid" class="grid"></ul>
    <p class="more">
      「参考動画」マークのマシンは、店舗によって置いていない場合があります。<br />No.付きのマシンの動画は、公式YouTubeの
      <a id="playlist" target="_blank" rel="noopener">「マシン使い方動画」プレイリスト</a>
      でも見られます。
    </p>
  </main>

  <dialog id="detail" class="detail">
    <button class="close" id="close" aria-label="閉じる">×</button>
    <div class="video"><iframe id="player" title="使い方動画" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div class="body">
      <p id="d-target" class="tag"></p>
      <h2 id="d-name"></h2>
      <h3>使い方の目安</h3>
      <ol id="d-steps"></ol>
      <p id="d-tips" class="tips"></p>
      <p id="d-credit" class="credit" hidden></p>
      <p class="note">※手順は一般的な目安です。正確な使い方は動画と店舗の案内をご確認ください。</p>
      <a id="d-yt" class="yt" target="_blank" rel="noopener">YouTubeで開く</a>
    </div>
  </dialog>

  <footer class="footer wrap">
    動画はYouTubeの公開動画を埋め込み表示しています。本サイトは個人が作成したページです。
  </footer>

  <script src="machines.js"></script>
  <script src="app.js"></script>
</body>
</html>
